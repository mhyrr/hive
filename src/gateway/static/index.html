<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIVE</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">HIVE</div>
    <div class="topbar-project" id="project-name">&mdash;</div>
    <div class="topbar-status">
      <span class="status-dot" id="supervisor-dot"></span>
      <span id="supervisor-label">&mdash;</span>
    </div>
    <div class="topbar-agents" id="agent-count">
      <span class="topbar-agents-label">&mdash;</span>
      <div class="agent-dropdown" id="agent-dropdown">
        <div class="agent-dropdown-header">Active Agents</div>
        <div class="agent-dropdown-list" id="agent-dropdown-list">
          <div class="agent-dropdown-empty">No active agents</div>
        </div>
      </div>
    </div>
    <div class="topbar-connection" id="connection-status">
      <span class="status-dot status-dot--disconnected"></span>
      <span>disconnected</span>
    </div>
  </header>

  <!-- Console panel -->
  <main class="console">
    <!-- Session toolbar -->
    <div class="session-toolbar" id="session-toolbar">
      <span class="session-id" id="session-id">&mdash;</span>
      <div class="session-toolbar-actions">
        <button class="session-btn" id="sessions-btn" title="Browse sessions">Sessions</button>
        <button class="session-btn" id="new-session-btn" title="New session (Ctrl+N)">+ New</button>
      </div>
      <!-- Sessions dropdown -->
      <div class="sessions-dropdown" id="sessions-dropdown">
        <div class="sessions-dropdown-header">Recent Sessions</div>
        <div class="sessions-dropdown-list" id="sessions-dropdown-list">
          <div class="sessions-dropdown-empty">No sessions</div>
        </div>
      </div>
    </div>

    <div class="console-history" id="console-history">
      <div class="console-welcome">
        <p>Welcome to HIVE. Type a message to talk to the hive mind.</p>
        <p class="console-welcome-hint">The console is your steering wheel. The feed is your dashboard.</p>
      </div>
    </div>
    <form class="console-input" id="console-form">
      <textarea id="console-input" placeholder="Talk to the hive... (Shift+Enter for newline)" autocomplete="off" autofocus rows="1"></textarea>
      <button type="submit" id="console-send-btn">Send</button>
    </form>
  </main>

  <!-- Feed panel -->
  <aside class="feed">
    <div class="feed-header">Feed</div>
    <div class="feed-entries" id="feed-entries">
      <!-- Feed entries appear here -->
    </div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
